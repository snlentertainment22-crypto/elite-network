<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Elite Trivia Blitz TV</title>
<style>
:root{color-scheme:dark;--cyan:#63dfff;--pink:#ff4edc;--white:#fff;--shadow:0 0 20px rgba(0,0,0,.45)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a;font-family:Arial,Helvetica,sans-serif;color:#fff}
#viewport{position:fixed;inset:0;display:grid;place-items:center;background:#02040a;overflow:hidden}
#stage{position:relative;width:min(100vw,calc(100vh * 16 / 9));height:min(100vh,calc(100vw * 9 / 16));aspect-ratio:16/9;overflow:hidden;background:#04060b}
#screen,.overlay{position:absolute;inset:0}
#screen{background:#04060b center/100% 100% no-repeat}
.hidden{display:none!important}
.debugFooter{position:absolute;left:1%;right:1%;bottom:.5%;text-align:center;font-size:12px;font-weight:700;color:#d9e7ff;text-shadow:0 2px 6px rgba(0,0,0,.8);opacity:.82;pointer-events:none}
.centerWrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:82%;text-align:center}
.pill{display:inline-block;padding:.65% 1.7%;border-radius:999px;background:rgba(4,10,20,.70);border:2px solid rgba(99,223,255,.75);font-size:26px;font-weight:900;letter-spacing:.04em;box-shadow:var(--shadow)}
.categoryTitle{margin:2% auto 0;width:84%;font-size:112px;font-weight:1000;line-height:1.02;text-shadow:0 4px 18px rgba(0,0,0,.7);text-transform:uppercase;overflow:hidden}
.categorySub{margin-top:1.5%;font-size:44px;font-weight:900;text-shadow:0 4px 18px rgba(0,0,0,.7)}
.waitingCopy{margin-top:2%;font-size:34px;font-weight:800;text-shadow:0 4px 16px rgba(0,0,0,.7)}
.board{position:absolute;inset:0}
.topInfo{position:absolute;inset:0;font-weight:900;text-shadow:0 2px 10px rgba(0,0,0,.75);pointer-events:none}
.topInfo .left,.topInfo .mid,.topInfo .right{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
/* Regular question / final wager header: coordinates are matched to the artwork. */
.topInfo.questionHeader .left{left:11.55%;width:11.6%;top:4.45%;height:13.0%;font-size:64px;line-height:1}
.topInfo.questionHeader .mid{left:27.2%;right:26.2%;top:4.45%;height:13.0%;font-size:30px;line-height:1.02;padding:0 1.2%}
.topInfo.questionHeader .right{right:8.2%;width:15.6%;top:4.45%;height:13.0%;font-size:50px;line-height:1.0;white-space:nowrap}
/* Roulette wager header uses the roulette artwork, whose timer circle sits slightly farther left. */
.topInfo.rouletteHeader .left{left:10.45%;width:11.2%;top:3.55%;height:14.1%;font-size:64px;line-height:1;z-index:2}
.topInfo.rouletteHeader .mid{left:28.0%;right:29.0%;top:3.45%;height:13.6%;font-size:30px;line-height:1.02;padding:0 1.2%;background:linear-gradient(90deg,rgba(4,13,34,.94),rgba(16,10,43,.94));border-radius:10px;z-index:2}
.topInfo.rouletteHeader .right{right:9.45%;width:16.6%;top:3.45%;height:13.6%;font-size:48px;line-height:1.0;white-space:nowrap;background:linear-gradient(90deg,rgba(13,11,39,.96),rgba(7,20,45,.96));border-radius:10px;z-index:2}
.questionBox{position:absolute;left:10.8%;right:10.8%;top:22.4%;height:20.5%;display:flex;align-items:center;justify-content:center;padding:1.3% 4.2%;text-align:center;font-size:58px;font-weight:900;line-height:1.08;text-shadow:0 3px 12px rgba(0,0,0,.85);overflow:hidden}
.choiceGrid{position:absolute;left:10.1%;right:10.1%;top:47.4%;height:34.2%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8% 3.6%}
.choiceCell{position:relative;display:flex;align-items:center;justify-content:center;padding:1.5% 8% 1.5% 13%;text-align:center;font-size:40px;font-weight:900;line-height:1.05;text-shadow:0 3px 12px rgba(0,0,0,.9);overflow:hidden}
.choiceCell.correct::before{content:"";position:absolute;inset:5%;border-radius:18px;background:rgba(76,255,151,.22);box-shadow:0 0 18px rgba(76,255,151,.55),inset 0 0 0 3px rgba(255,255,255,.25)}
.choiceCell>span{position:relative;z-index:1;display:block;width:100%;max-height:100%;overflow:hidden}
.sixMask{position:absolute;left:11.5%;right:8.5%;top:45.5%;bottom:5.5%;background:rgba(3,8,18,.88);border-radius:22px;box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
.sixGrid{position:absolute;left:13%;right:10%;top:47%;height:43%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:5.5% 3%}
.sixChoice{position:relative;display:flex;align-items:center;justify-content:center;padding:1% 6%;border:4px solid;border-radius:18px;background:rgba(3,8,18,.62);text-align:center;font-size:32px;font-weight:900;line-height:1.03;text-shadow:0 3px 12px rgba(0,0,0,.9);overflow:hidden}
.sixChoice:nth-child(1){border-color:#15dfff;box-shadow:0 0 15px #15dfff}.sixChoice:nth-child(2){border-color:#ff9a21;box-shadow:0 0 15px #ff9a21}.sixChoice:nth-child(3){border-color:#57ff2d;box-shadow:0 0 15px #57ff2d}.sixChoice:nth-child(4){border-color:#ffe52e;box-shadow:0 0 15px #ffe52e}.sixChoice:nth-child(5){border-color:#b96cff;box-shadow:0 0 15px #b96cff}.sixChoice:nth-child(6){border-color:#ff4f8f;box-shadow:0 0 15px #ff4f8f}
.sixChoice.correct::before{content:"";position:absolute;inset:4px;border-radius:12px;background:rgba(76,255,151,.24);box-shadow:inset 0 0 0 3px rgba(255,255,255,.24)}
.sixChoice>span{position:relative;z-index:1}
.rouletteGrid{position:absolute;left:20%;right:20%;top:43.2%;height:46.8%;display:grid;grid-template-columns:1fr;grid-template-rows:repeat(3,1fr);gap:5.5%}
.rouletteChoice{display:flex;align-items:center;justify-content:center;text-align:center;font-size:46px;font-weight:1000;line-height:1;overflow:hidden}
.bottomBanner{position:absolute;left:18%;right:18%;bottom:3.4%;text-align:center;font-size:22px;font-weight:800;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.finalLabel{position:absolute;left:50%;top:17.5%;transform:translateX(-50%);font-size:38px;font-weight:1000;color:#fff;text-shadow:0 3px 12px rgba(0,0,0,.8)}
.finalNote{position:absolute;left:13%;right:13%;bottom:12%;text-align:center;font-size:42px;font-weight:900;line-height:1.16;text-shadow:0 3px 12px rgba(0,0,0,.85)}
.scoreWrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:76%}
.scoreTitle{text-align:center;font-size:96px;font-weight:1000;text-transform:uppercase;text-shadow:0 4px 18px rgba(0,0,0,.7)}
.scoreSub{text-align:center;font-size:38px;font-weight:900;margin-top:.5%;text-shadow:0 4px 16px rgba(0,0,0,.7)}
.scoreList{display:grid;gap:10px;margin-top:2%}
.scoreRow{display:grid;grid-template-columns:8% 1fr 14%;gap:1.5%;align-items:center;padding:1.15% 1.6%;border-radius:18px;background:rgba(4,10,20,.76);border:2px solid rgba(99,223,255,.75);box-shadow:var(--shadow);font-size:32px;font-weight:900}
.rank{color:#7eeaff}.score{color:#ffe67c;text-align:right}
.smallMsg{margin-top:1.5%;text-align:center;font-size:26px;font-weight:800}
.speedWrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:72%;text-align:center;padding:3%;border-radius:28px;background:rgba(4,10,20,.80);border:3px solid rgba(255,203,84,.8);box-shadow:0 18px 50px rgba(0,0,0,.5)}
.speedTitle{font-size:82px;font-weight:1000;color:#ffe67c;text-shadow:0 4px 16px rgba(0,0,0,.75)}
.speedList{margin-top:2%;display:grid;gap:12px}
.speedRow{display:grid;grid-template-columns:10% 1fr 24%;gap:1.5%;align-items:center;padding:1.3% 1.7%;border-radius:18px;background:rgba(255,255,255,.08);font-size:32px;font-weight:900}

.networkShell{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:4.5%;text-align:center;background:radial-gradient(circle at top,#182a44 0,#07101c 58%,#02050a 100%)}
.networkShell.sports{background:radial-gradient(circle at top,#1f5934 0,#092414 58%,#020904 100%)}
.networkShell.afterdark{background:radial-gradient(circle at top,#5c174c 0,#21081c 58%,#060205 100%)}
/* Each mini-game owns its visual identity; only Quick 3 uses Quick 3 artwork. */
.networkShell.miniGameShell{background:transparent}
.networkShell.miniGameShell.gibberishShell{
 background:radial-gradient(circle at 68% 18%,rgba(67,46,103,.85),transparent 55%),
            radial-gradient(circle at 20% 80%,rgba(16,65,105,.58),transparent 58%),#050c20;
}
.networkShell.miniGameShell.reactionShell{
 background:radial-gradient(circle at 60% 18%,#214963 0%,#091a31 55%,#030914 100%);
}
.networkKicker{font-size:30px;font-weight:1000;letter-spacing:.18em;color:#7eeaff;margin-bottom:22px}
/* Reaction Rush: compact counter, cue number is not the randomized light position. */
.reactionShell .networkKicker{font-size:clamp(20px,2.1vw,30px);margin-bottom:7px;letter-spacing:.10em}
.reactionCounter{font-size:clamp(22px,2.5vw,39px);font-weight:1000;color:#ffd85a;letter-spacing:.055em;line-height:1.16;white-space:nowrap;max-width:100%;margin:4px auto 13px;text-align:center}
/* Waiting lights stay neutral. The GREEN lamp is the only GO signal. */
.reactionTvLights{display:flex;justify-content:center;align-items:center;gap:clamp(10px,1.5vw,26px);margin:24px auto 22px}
.reactionTvLamp{display:inline-grid;place-items:center;flex:0 0 auto;width:clamp(92px,8vw,128px);height:clamp(92px,8vw,128px);border-radius:50%;border:6px solid #45647e;background:#14283d;color:#e6f5ff;font-size:clamp(43px,5vw,69px);font-weight:1000;line-height:1}
.reactionTvLamp.go{border-color:#67ffa8;background:#178c50;color:#fff;box-shadow:0 0 30px rgba(61,255,146,.55)}
.networkTitle{font-size:82px;font-weight:1000;line-height:1.02;text-transform:uppercase;text-shadow:0 5px 24px rgba(0,0,0,.45)}
.networkSub{font-size:30px;font-weight:800;color:#d2d9e7;margin-top:24px;line-height:1.35}
.networkNext{margin-top:34px;display:inline-block;padding:14px 24px;border-radius:999px;background:rgba(255,255,255,.1);font-size:24px;font-weight:900}
.channelCard{width:86%;max-width:1280px;padding:48px 56px;border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.045));border:2px solid rgba(126,234,255,.18);box-shadow:0 20px 70px rgba(0,0,0,.35)}
.channelCard .label{font-size:28px;letter-spacing:.15em;font-weight:1000;color:#ffd85a;margin-bottom:22px}
.channelCard .main{font-size:54px;font-weight:950;line-height:1.18}
.channelCard .small{font-size:25px;color:#c7cfda;margin-top:26px;font-weight:700}
.channelClock{position:absolute;right:3.3%;top:3.2%;font-size:20px;font-weight:900;color:#dbe9ff;opacity:.85}
.guideGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:18px;text-align:left}
.guideItem{padding:14px 16px;border-radius:15px;background:rgba(3,8,18,.58);border:1px solid rgba(126,234,255,.24);min-height:72px}
.guideTime{font-size:20px;font-weight:1000;color:#ffd85a;margin-bottom:5px}
.guideTitle{font-size:21px;font-weight:950;line-height:1.05}
.comingTime{font-size:96px;font-weight:1000;line-height:1;color:#7eeaff;margin:10px 0;text-shadow:0 0 28px rgba(99,223,255,.25)}
.showBug{position:absolute;left:1.7%;top:1.8%;z-index:30;padding:8px 14px;border-radius:10px;background:rgba(2,7,16,.88);border:2px solid rgba(99,223,255,.7);font-size:16px;font-weight:1000;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 8px 25px rgba(0,0,0,.35)}
.showBug.sports{border-color:#65ff91;color:#9cffb6}.showBug.after_dark{border-color:#ff65df;color:#ff9deb}.showBug.standard{color:#8feaff}
.miniWrap{width:86%;max-width:1280px;margin:auto;padding:46px 56px;border-radius:30px;background:linear-gradient(145deg,rgba(14,35,67,.96),rgba(6,10,24,.96));border:3px solid rgba(126,234,255,.48);box-shadow:0 24px 70px rgba(0,0,0,.45)}
.miniTitle{font-size:76px;font-weight:1000;text-transform:uppercase;line-height:1}.miniSub{font-size:27px;font-weight:900;color:#ffd85a;margin-top:16px}.miniCategory{font-size:24px;font-weight:1000;letter-spacing:.12em;color:#7eeaff;text-transform:uppercase;margin-bottom:14px}.miniQuestion{font-size:46px;font-weight:1000;line-height:1.12;margin:0 auto 24px;max-width:1100px}.miniChoices{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}.miniChoice{position:relative;padding:17px 20px;border-radius:16px;background:rgba(255,255,255,.075);border:2px solid rgba(255,255,255,.16);font-size:27px;font-weight:950;line-height:1.1}.miniChoice.correct{background:rgba(68,255,143,.19);border-color:#6cffaf;box-shadow:0 0 22px rgba(108,255,175,.22)}.miniTimer{position:absolute;right:4%;top:5%;font-size:56px;font-weight:1000;color:#fff}.miniProgress{font-size:21px;font-weight:900;color:#c9d5e8;margin-top:20px}.miniAnswer{font-size:26px;font-weight:950;color:#6cffaf;margin-top:15px}



/* ELITE MINI-GAMES: 12-second text instructions on the existing channel theme. */
.networkShell.miniRulesShell{
 background:radial-gradient(circle at 18% 16%,#244a79 0%,#0b1a38 49%,#020713 100%);
 padding:2.5%;
}
.networkShell.miniRulesShell.warpShell{
 background:radial-gradient(circle at 75% 15%,#46316c 0%,#171a3b 47%,#04091b 100%);
}
.networkShell.miniRulesShell.reactionShell{
 background:radial-gradient(circle at 70% 18%,#22546b 0%,#0b243a 52%,#030a18 100%);
}
.networkShell.miniRulesShell.gibberishShell{
 background:radial-gradient(circle at 66% 17%,#48365c 0%,#182442 50%,#050b21 100%);
}
.miniRulesPanel{
 width:85%;max-width:1460px;max-height:94%;padding:2% 4%;border-radius:29px;
 background:linear-gradient(145deg,rgba(10,27,58,.96),rgba(3,9,23,.95));
 border:3px solid rgba(126,234,255,.7);box-shadow:0 25px 75px rgba(0,0,0,.5);
 display:flex;flex-direction:column;justify-content:center;align-items:center;
}
.miniRulesBrand{display:block;max-width:245px;max-height:100px;width:23%;object-fit:contain;filter:drop-shadow(0 5px 12px #000)}
.miniRulesKicker{font-size:24px;font-weight:1000;letter-spacing:.17em;color:#81eaff;margin-top:4px}
.miniRulesHeading{font-size:clamp(37px,4.7vw,78px);line-height:1;font-weight:1000;margin:10px 0 8px;text-shadow:0 3px 12px #000}
.miniRulesSub{font-size:clamp(19px,1.9vw,31px);font-weight:950;color:#ffe17e;margin-bottom:16px}
.miniRulesSteps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:100%}
.miniRulesStep{padding:19px 14px 18px;border-radius:16px;background:rgba(255,255,255,.055);
 border:2px solid rgba(120,231,255,.25);text-align:center;
 font-size:clamp(16px,1.65vw,27px);font-weight:900;line-height:1.2;
 display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.miniRulesStepNum{display:grid;place-items:center;width:45px;height:45px;border-radius:50%;
 background:#136e93;border:2px solid #9bedff;font-weight:1000;font-size:26px;color:#fff;flex-shrink:0}
.miniRulesFooter{font-size:clamp(16px,1.35vw,23px);font-weight:900;color:#bcdaf5;margin-top:17px;line-height:1.25}
@media(max-height:750px){
 .miniRulesPanel{max-height:96%;padding:1.4% 3%}
 .miniRulesBrand{max-height:67px}
 .miniRulesHeading{margin:5px 0;font-size:clamp(32px,4.1vw,63px)}
 .miniRulesSub{margin-bottom:9px}
 .miniRulesStep{padding:10px 8px;font-size:clamp(16px,1.45vw,23px);gap:5px}
 .miniRulesStepNum{width:35px;height:35px;font-size:21px}
 .miniRulesFooter{margin-top:9px}
}
/* Leave the persistent phone-join QR on the right of typed-answer instructions. */
.miniRulesShell.qrVisible .miniRulesPanel{width:78%;margin-right:13%}

/* Brain Warp: responsive TV rebus grid, no external images or scripts. */
.networkShell.miniGameShell.warpShell{
 background:radial-gradient(circle at 70% 15%,rgba(91,51,148,.65),transparent 54%),
            radial-gradient(circle at 20% 80%,rgba(14,112,151,.45),transparent 60%),#080b24;
}
.warpWrap{width:91%;max-width:1480px;padding:2.4% 3%;}
.warpBoard{width:min(78%,850px);height:clamp(270px,42vh,445px);margin:14px auto;
 display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));
 align-items:stretch;justify-items:stretch;border:4px solid #85ddff;border-radius:24px;
 padding:15px;background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(6,13,45,.8));
 box-shadow:inset 0 0 34px rgba(0,0,0,.35),0 15px 45px rgba(0,0,0,.32);}
.warpTile{display:flex;justify-content:center;align-items:center;min-width:0;
 font-size:clamp(23px,3vw,48px);font-weight:1000;letter-spacing:.03em;white-space:nowrap;
 color:#fff;text-shadow:0 4px 15px #001;}
.warpTile.small{font-size:clamp(15px,1.8vw,27px)}
.warpTile.large{font-size:clamp(29px,3.7vw,58px)}
.warpTile.bright{color:#ffe575}
.warpTile.flipped{transform:scaleX(-1)}
.warpTile.tilt{transform:rotate(-18deg)}
.warpTile.crossed{text-decoration:line-through;text-decoration-thickness:5px;text-decoration-color:#ff628c}
.warpTile.tight{font-size:clamp(13px,1.6vw,24px);letter-spacing:-.06em}
.warpWrap .gibHud{margin-top:9px}
.warpWrap .gibBottom{margin-top:6px}
@media(max-height:800px){
 .warpWrap{padding:1.1% 2%;}
 .warpBoard{height:clamp(210px,36vh,315px);margin:5px auto;padding:8px}
 .warpTile{font-size:clamp(18px,2.5vw,39px)}
 .warpTile.small{font-size:clamp(13px,1.5vw,22px)}
 .warpTile.large{font-size:clamp(22px,3vw,48px)}
 .warpTile.tight{font-size:clamp(12px,1.5vw,20px)}
}
/* Elite Gibberish: TV-first layout with large, readable phrases. */
.gibWrap{
 width:94%;max-width:none;min-height:83%;padding:2.2% 3% 2%;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
}
/* Keep the active clue in a reserved central lane; the join QR lives at right. */
.gibWrap.gibPlay{
 height:84%;min-height:0;max-height:84%;
 justify-content:flex-start;
}
.gibPlay .gibPhrase{
 width:70%;flex:1 1 auto;min-height:0;max-height:none;
 margin:10px auto 6px;font-size:clamp(34px,5.4vw,94px);
}
.gibPlay .gibInstruction{flex:0 0 auto;max-width:70%;}
.gibPlay .gibBottom{
 width:calc(100% - 380px);max-width:960px;min-width:0;
 align-self:center;flex:0 0 auto;margin:7px auto 0;
 text-align:center;line-height:1.14;
}
.gibPlay .gibReveal{max-width:74%;flex:0 0 auto;}
/* At reveal the decoded answer replaces the clue in its large central lane. */
.gibPlay .gibAnswerPhrase{color:#6cffaf;font-size:clamp(34px,5.4vw,94px);}
.gibPlay .gibAnswerLabel{color:#a8f9ca;letter-spacing:.09em;}
/* A smaller QR area is important on older 720p TVs. */

.gibKicker{font-size:30px;font-weight:1000;letter-spacing:.14em;color:#7eeaff}
.gibRound{margin-top:8px;font-size:25px;font-weight:900;color:#ffd85a}
.gibHud{display:flex;gap:26px;align-items:stretch;justify-content:center;margin-top:16px}
.gibMetric{min-width:190px;padding:9px 22px;border:3px solid #6ae0ff;border-radius:17px;background:rgba(2,8,25,.88);box-shadow:0 0 18px rgba(106,224,255,.18)}
.gibMetric.points{min-width:250px;border-color:#ffd85a;color:#ffd85a}
.gibMetric .number{font-size:58px;font-weight:1000;line-height:1.04}
.gibMetric .metricLabel{font-size:16px;font-weight:900;letter-spacing:.12em;margin-top:3px}
.gibPhrase{
 width:100%;min-height:170px;max-height:310px;display:flex;align-items:center;justify-content:center;
 font-size:clamp(44px,6vw,110px);font-weight:1000;line-height:1.05;
 text-align:center;letter-spacing:.02em;text-transform:uppercase;
 text-shadow:0 5px 22px rgba(0,0,0,.88);overflow-wrap:break-word;overflow:hidden;
 margin:18px 0 10px;padding:0 2%;
}
.gibInstruction{font-size:25px;font-weight:900;color:#e6edff;max-width:75%;line-height:1.17}
.gibReveal{font-size:35px;font-weight:1000;color:#6cffaf;margin:6px 0 10px}
.gibBottom{align-self:center;width:75%;font-size:21px;font-weight:900;color:#c9d5e8;margin:12px auto 0;text-align:center}
.gibBottom .miniProgress{font-size:20px;margin-top:8px}
/* Persistent QR: not recreated on each TV poll, so it cannot flash. */
#gibJoinPanel{
 position:absolute;right:2.8%;bottom:12%;z-index:25;width:192px;
 text-align:center;padding:11px 10px 9px;border:2px solid #7eeaff;
 border-radius:17px;background:rgba(3,10,23,.96);
 box-shadow:0 8px 28px rgba(0,0,0,.6);pointer-events:none;
}

/* ---------- QUESTION ---------- */

.questionBox{
 left:9%;
 right:9%;
 top:18%;
 height:22%;
 padding:1.5% 4%;
 background:linear-gradient(
  180deg,
  var(--elite-panel2),
  var(--elite-panel)
 );
 border:4px solid var(--elite-a);
 border-radius:24px;
 box-shadow:
  0 0 20px color-mix(in srgb,var(--elite-a) 58%,transparent),
  inset 0 0 28px rgba(0,0,0,.34);
 font-size:54px;
}

/* ---------- FOUR CHOICES ---------- */

.choiceGrid{
 left:10%;
 right:10%;
 top:45%;
 height:37%;
 gap:6% 3.2%;
}

.choiceCell{
 background:rgba(3,9,25,.88);
 border:4px solid #20dcff;
 border-radius:20px;
 padding:1.5% 5% 1.5% 10%;
 box-shadow:
  inset 0 0 24px rgba(0,0,0,.32);
 font-size:38px;
}

.choiceCell:nth-child(1){
 border-color:#20dcff;
 box-shadow:0 0 15px rgba(32,220,255,.55);
}

.choiceCell:nth-child(2){
 border-color:#ff9a21;
 box-shadow:0 0 15px rgba(255,154,33,.55);
}

.choiceCell:nth-child(3){
 border-color:#55ff42;
 box-shadow:0 0 15px rgba(85,255,66,.50);
}

.choiceCell:nth-child(4){
 border-color:#ffe33c;
 box-shadow:0 0 15px rgba(255,227,60,.50);
}

.choiceCell::after{
 position:absolute;
 left:3.2%;
 top:50%;
 transform:translateY(-50%);
 font-size:34px;
 font-weight:1000;
 z-index:2;
}

.choiceCell:nth-child(1)::after{content:"A";color:#20dcff}
.choiceCell:nth-child(2)::after{content:"B";color:#ff9a21}
.choiceCell:nth-child(3)::after{content:"C";color:#55ff42}
.choiceCell:nth-child(4)::after{content:"D";color:#ffe33c}

/* ---------- SIX CHOICES ---------- */

.sixMask{
 display:none;
}

.sixGrid{
 left:9%;
 right:9%;
 top:44%;
 height:45%;
 gap:4.2% 3%;
}

.sixChoice{
 background:rgba(3,9,25,.88);
 border-width:4px;
 border-radius:18px;
 padding:1% 5% 1% 9%;
 font-size:30px;
}

.sixChoice::after{
 position:absolute;
 left:3%;
 top:50%;
 transform:translateY(-50%);
 font-size:29px;
 font-weight:1000;
 z-index:2;
}

.sixChoice:nth-child(1)::after{content:"A";color:#15dfff}
.sixChoice:nth-child(2)::after{content:"B";color:#ff9a21}
.sixChoice:nth-child(3)::after{content:"C";color:#57ff2d}
.sixChoice:nth-child(4)::after{content:"D";color:#ffe52e}
.sixChoice:nth-child(5)::after{content:"E";color:#b96cff}
.sixChoice:nth-child(6)::after{content:"F";color:#ff4f8f}

/* ---------- ROULETTE ---------- */

.rouletteGrid{
 left:25%;
 right:25%;
 top:46%;
 height:40%;
 gap:7%;
}

.rouletteChoice{
 background:rgba(3,9,25,.90);
 border:4px solid;
 border-radius:22px;
 font-size:46px;
 box-shadow:
  inset 0 0 24px rgba(0,0,0,.38);
}

.rouletteChoice:nth-child(1){
 border-color:#20dcff;
 box-shadow:0 0 18px rgba(32,220,255,.55);
}

.rouletteChoice:nth-child(2){
 border-color:#ff9a21;
 box-shadow:0 0 18px rgba(255,154,33,.55);
}

.rouletteChoice:nth-child(3){
 border-color:#55ff42;
 box-shadow:0 0 18px rgba(85,255,66,.50);
}

/* ---------- FINAL WAGER ---------- */

.finalLabel{
 top:16.2%;
 padding:.45% 2.2%;
 background:rgba(3,9,25,.90);
 border:3px solid var(--elite-b);
 border-radius:18px;
 box-shadow:
  0 0 18px color-mix(in srgb,var(--elite-b) 55%,transparent);

}

.finalNote{

  0 0 16px color-mix(in srgb,var(--elite-b) 45%,transparent);

}

<script>
const PAGE_BUILD='__AUTO_ELITE_BUILD__';

function makeThemeAssets(folder){return {
  category:`/assets/slides/${folder}/category_bg.png`,
  question:`/assets/slides/${folder}/question_bg.png`,
  roulette:`/assets/slides/${folder}/roulette_bg.png`,

    tie_breaker:`/assets/slides/${folder}/tie_breaker_slide.png`
  }
};}
const sportsAssets=makeThemeAssets('sports');
const afterDarkAssets=makeThemeAssets('after_dark');
function assetsFor(state){
  const profile=state?.network?.show_profile||'standard';
  if(profile==='sports')return sportsAssets;

const FALLBACK_DISPLAY={
  category_max_px:112,category_min_px:42,
  question_max_px:58,question_min_px:26,
  answer_max_px:40,answer_min_px:20,
  roulette_hint_max_px:54,roulette_hint_min_px:24,

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function ensureCurrentBuild(serverBuild,state){const n=state?.network||{};const mini=n.mini_game||{};const signup=n.standalone_mini_signup;const unsafe=typeof n.game_active!=="boolean"||typeof mini.active!=="boolean"||n.game_active||mini.active||!!n.lead_in_phase||(signup&&signup.seconds_until<=300);if(serverBuild!==PAGE_BUILD&&unsafe)return true;if(!serverBuild||serverBuild===PAGE_BUILD)return true;const u=new URL(location.href);u.searchParams.set('build',serverBuild);u.searchParams.set('_reload',Date.now());location.replace(u.toString());return false;}
let CURRENT_BACKGROUND=null;
function setBackground(url){
  const next=url ? `${url}${url.includes('?')?'&':'?'}v=${encodeURIComponent(PAGE_BUILD)}` : null;
  if(next===CURRENT_BACKGROUND)return;

  document.getElementById('screen').style.backgroundImage=next?`url('${next}')`:'none';
}
function footerText(state){return `${state.status}  -  ${state.team_count} team${state.team_count===1?'':'s'}  -  Build ${state.app_build}`;}
function stageScale(){return Math.max(.45,document.getElementById('stage').clientWidth/1600);}
function fitText(el,maxPx,minPx){if(!el)return;const scale=stageScale();let size=Math.max(minPx*scale,maxPx*scale);const floor=minPx*scale;el.style.fontSize=`${size}px`;let guard=0;while(size>floor&&(el.scrollHeight>el.clientHeight+1||el.scrollWidth>el.clientWidth+1)&&guard<120){size-=1;el.style.fontSize=`${size}px`;guard++;}}
function fitAll(state){const d={...FALLBACK_DISPLAY,...(state.display_settings||{})};requestAnimationFrame(()=>{document.querySelectorAll('.categoryTitle').forEach(el=>fitText(el,d.category_max_px,d.category_min_px));document.querySelectorAll('.questionBox').forEach(el=>fitText(el,el.dataset.kind==='hint'?d.roulette_hint_max_px:d.question_max_px,el.dataset.kind==='hint'?d.roulette_hint_min_px:d.question_min_px));document.querySelectorAll('.choiceCell').forEach(el=>fitText(el,d.answer_max_px,d.answer_min_px));document.querySelectorAll('.sixChoice').forEach(el=>fitText(el,Math.min(d.answer_max_px,32),Math.min(d.answer_min_px,18)));document.querySelectorAll('.rouletteChoice').forEach(el=>fitText(el,48,28));document.querySelectorAll('.topInfo .mid').forEach(el=>fitText(el,d.team_status_max_px,d.team_status_min_px));const left=document.querySelector('.topInfo .left');if(left)left.style.fontSize=`${d.timer_px*stageScale()}px`;const right=document.querySelector('.topInfo .right');if(right)right.style.fontSize=`${d.points_px*stageScale()}px`;});}
function pointLabel(q,state){if(q.scoring_type==='fastest'){const v=state.current_fastest_display==null?q.max_points:Number(state.current_fastest_display);return `${v} PTS`;}if(q.scoring_type==='roulette')return '--';if(q.scoring_type==='final_wager')return 'WAGER';return `${q.fixed_points} PTS`;}
function scoreRows(rows){if(!rows.length)return '<div class="smallMsg">Waiting for teams.</div>';return rows.map(r=>`<div class="scoreRow"><div class="rank">#${r.rank}</div><div>${esc(r.name)}</div><div class="score">${r.score}</div></div>`).join('');}
function teamStatus(state,phase){const rows=phase==='wager'?state.outstanding_wager_teams:state.outstanding_answer_teams;const done=phase==='wager'?state.all_wagers_in:state.all_answers_in;if(state.team_count===0)return 'NO TEAMS REGISTERED';if(done)return ' ALL TEAMS IN';if(!rows||!rows.length)return `${state.team_count} TEAMS READY`;return rows.map(t=>`#${t.number} ${esc(t.name)}`).join('  -  ');}

function renderCategory(state){

 if(isFinal){const answer=reveal&&q.answer_display?`<div class="finalNote" style="bottom:5.5%;color:#6cffaf">ANSWER: ${esc(q.answer_display)}</div>`:'';content=`<div class="questionBox">${esc(q.question)}</div><div class="finalNote">Teams choose <span style="color:#ff6de8">ALL IN</span> or <span style="color:#63dfff">SAVE MY POINTS</span> on their phones.</div>${answer}`;}
 else {const allChoices=(q.choices||[]);if(allChoices.length>4){const choices=allChoices.slice(0,6).map((txt,i)=>`<div class="sixChoice ${reveal&&i===q.correct_index?'correct':''}"><span>${esc(txt)}</span></div>`).join('');content=`<div class="questionBox">${esc(q.question)}</div><div class="sixMask"></div><div class="sixGrid">${choices}</div>`;}else{const choices=allChoices.slice(0,4).map((txt,i)=>`<div class="choiceCell ${reveal&&i===q.correct_index?'correct':''}"><span>${esc(txt)}</span></div>`).join('');content=`<div class="questionBox">${esc(q.question)}</div><div class="choiceGrid">${choices}</div>`;}}
 document.getElementById('overlay').innerHTML=`<div class="board ${profile}"><div class="topInfo questionHeader"><div class="left">${left}</div><div class="mid">${teams}</div><div class="right">${right}</div></div>${content}<div class="bottomBanner">${reveal?'Correct answer highlighted':'Answer on your phone before time runs out.'}</div></div>`;fitAll(state);}
function renderRouletteWager(state){const q=state.question;setBackground(assetsFor(state).roulette);const profile=state?.network?.show_profile||'standard';const left=state.timer_running?Math.ceil(state.timer_remaining):q.wager_seconds;const teams=teamStatus(state,'wager');const right='--';document.getElementById('overlay').innerHTML=`<div class="board ${profile}"><div class="topInfo rouletteHeader"><div class="left">${left}</div><div class="mid">${teams}</div><div class="right">${right}</div></div><div class="questionBox" data-kind="hint">${esc(String(q.hint||'').trim()||'MAKE YOUR WAGER NOW!')}</div><div class="rouletteGrid"><div class="rouletteChoice">0%</div><div class="rouletteChoice">50%</div><div class="rouletteChoice">100%</div></div><div class="bottomBanner">MAKE YOUR WAGER NOW! Choose 0%, 50%, or 100% on your phone.</div></div>`;fitAll(state);}

// Measure actual wrapped text, not the clipped flex container.
function fitGibberishPhrase(){
 const lane=document.querySelector('.gibPlay .gibPhrase');
 const text=lane?.querySelector('.gibPhraseText');
 if(!text||!lane.clientHeight)return;
 const max=Math.floor(parseFloat(getComputedStyle(lane).fontSize));
 const height=lane.clientHeight-4;
 const fits=size=>{text.style.fontSize=size+'px';return text.getBoundingClientRect().height<=height&&text.scrollWidth<=text.clientWidth+1;};
 if(fits(max))return;
 let low=1,high=max-1,best=1;
 while(low<=high){const mid=Math.floor((low+high)/2);if(fits(mid)){best=mid;low=mid+1;}else{high=mid-1;}}
 text.style.fontSize=best+'px';
}
window.addEventListener('resize',fitGibberishPhrase);

const ELITE_TV_CLIENT_ID=(()=>{

// Elite mini-games: use one server-owned deadline, not independent poll snapshots.
// performance.now() makes this immune to differing TV/phone system clocks.
const eliteMiniClock={active:false,deadlineMs:0,serverAtResponseMs:0,responsePerfMs:0,phase:''};
function syncEliteMiniClock(state,sentPerf,receivedPerf){
 const m=state?.network?.mini_game||{};
 if(!m.active||!['brain_warp','gibberish'].includes(m.game_type)){
  eliteMiniClock.active=false;
  return;
 }
 const now=Number(m.timer_server_now_ms),deadline=Number(m.timer_deadline_ms);
 if(!Number.isFinite(now)||!Number.isFinite(deadline)||deadline<now){
  eliteMiniClock.active=false;
  return;
 }
 // Network round-trip adjustment, capped to avoid huge clock jumps on a stalled fetch.
 const halfRtt=Math.min(500,Math.max(0,receivedPerf-sentPerf)/2);
 eliteMiniClock.active=true;
 eliteMiniClock.deadlineMs=deadline;
 eliteMiniClock.serverAtResponseMs=now+halfRtt;
 eliteMiniClock.responsePerfMs=receivedPerf;
 eliteMiniClock.phase=`${m.game_type}:${m.phase}:${m.question_index}`;
}
function eliteMiniSecondsLive(){
 if(!eliteMiniClock.active)return null;
 return Math.max(0,(eliteMiniClock.deadlineMs-eliteMiniClock.serverAtResponseMs
  -(performance.now()-eliteMiniClock.responsePerfMs))/1000);
}
function updateEliteMiniTvClock(){
 const sec=eliteMiniSecondsLive();
 if(sec===null)return;
 const timer=document.getElementById('eliteMiniTvSeconds');
 if(timer){
  timer.textContent=String(Math.ceil(sec));
 }
}

const POLL_ACTIVE_MS=1000;
const POLL_IDLE_MS=30000;
const FETCH_TIMEOUT_MS=5000;
let LAST_RENDER_KEY='';

async function fetchWithTimeout(url,options={}){
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),FETCH_TIMEOUT_MS);
 try{
  return await fetch(url,{...options,signal:controller.signal});
 }finally{
  clearTimeout(timer);
 }
}

    client_id:ELITE_TV_CLIENT_ID,
    visibility:document.visibilityState,
    path:location.pathname
   })
  });
 }catch(e){}
}

function renderKey(state){
 const n=state.network||{};
 const p=n.program||{};
 const m=n.mini_game||{};
 const q=state.question||{};
 const comingSecond=(n.filler_type==='coming_up'&&n.next_event)
  ? Math.floor(Number(n.next_event.seconds_until||0))
  : null;
 const miniSecond=m.active?Math.ceil(Number(m.seconds_remaining||0)):null;
 const leadInSecond=n.lead_in_next_event
 ? Math.floor(Number(n.lead_in_next_event.seconds_until||0))
 : null;
 const gameSecond=state.timer_running?Math.ceil(Number(state.timer_remaining||0)):null;
 return JSON.stringify([
  n.lead_in_phase,
  leadInSecond,
  n.standalone_mini_signup?.game_type||'',
  n.standalone_mini_signup?.seconds_until??null,
  state.app_build,

  state.all_wagers_in,
  state.timer_running,
  state.timer_phase,
  gameSecond,
  state.current_fastest_display,
  state.speed_bonus_remaining,
  n.clock_revision,
  n.game_active,
  n.show_profile,
  n.show_title,
  p.id,
  p.kind,
  n.filler_type,
  n.content_item?.url||'',
  n.did_you_know,
  n.next_event?.id||'',
  comingSecond,
  m.active,
  m.phase,
  m.question_index,
  miniSecond
 ]);
}

function nextTvPollMs(state){
 const n=state?.network||{}, m=n.mini_game||{};
 if(n.game_active||m.active||n.lead_in_phase)return POLL_ACTIVE_MS;
 const signup=n.standalone_mini_signup;
 if(signup&&Number(signup.seconds_until)<=300)return POLL_ACTIVE_MS;
 let wait=POLL_IDLE_MS;
 for(const v of [n.filler_remaining_seconds,n.next_channel_cue_seconds]){
  const seconds=Number(v);
  if(Number.isFinite(seconds)&&seconds>0)wait=Math.min(wait,Math.max(800,seconds*1000+120));
 }
 const untilEvent=Number(n.next_event?.seconds_until);
 if(Number.isFinite(untilEvent)&&untilEvent>0){
  if(untilEvent<=600)return POLL_ACTIVE_MS;
  wait=Math.min(wait,Math.max(800,(untilEvent-600)*1000+120));
 }
 if(signup){
  const until=Number(signup.seconds_until);
  if(Number.isFinite(until)&&until>300)wait=Math.min(wait,Math.max(800,(until-300)*1000+120));
 }
 return Math.max(800,Math.min(POLL_IDLE_MS,Math.round(wait)));
}
async function poll(){
 let nextMs=5000;
 try{
  const sentPerf=performance.now();
  const r=await fetchWithTimeout('/api/state',{cache:'no-store'});
  if(!r.ok)throw new Error(`HTTP ${r.status}`);
  const d=await r.json();
  const receivedPerf=performance.now();
  if(d.ok){
   if(!ensureCurrentBuild(d.state.app_build,d.state))return;
   nextMs=nextTvPollMs(d.state);
   syncEliteMiniClock(d.state,sentPerf,receivedPerf);
   const key=renderKey(d.state);
   if(key!==LAST_RENDER_KEY){
    LAST_RENDER_KEY=key;
    render(d.state);
   }
   updateEliteMiniTvClock();
  }
 }catch(e){
  document.getElementById('footer').textContent='Waiting for local Auto Elite server...';
 }
 setTimeout(poll,nextMs);
}
poll();
